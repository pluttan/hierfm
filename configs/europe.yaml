# European hierarchy for the generality check (data/processed/europe, built by `make data`).
name: europe
processed: data/processed/europe
runs: runs/europe
horizons: [24, 168]
context: 2048
origin_hour: 23          # 00:00 CET in UTC
test_start: "2025-10-01"   # after the release of Chronos-2 (docs/research/README.md, 5.3)
test_end: "2026-09-22"     # the data end on 2026-09-30, the weekly horizon needs 7 days
windows: [7, 14, 28, 91, 365]
samples: 200
models:
  - {name: snaive, params: {season: 168}}
  - {name: gbm, params: {trees: 400, train_days: 730}}
  - {name: chronos2, params: {}}
  - {name: chronos2, label: chronos2_temp, params: {temp: true}}
  - {name: chronos2, label: chronos2_joint, params: {joint: true}}
  - {name: timesfm25, params: {batch: 256}}
  - {name: timesfm3, params: {}}
  - {name: timesfm3, label: timesfm3_temp, params: {temp: true}}
  - {name: timesfm3, label: timesfm3_joint, params: {joint: true}}
  - {name: moirai2, params: {}}
methods: [base, bu, ols, wls_struct, wls_var, mint_shrink, mint_shrink_neff, prior_shrink, prior_shrink_raw, prior_only]
dependence: [independent, schaake_hist, schaake_temp, schaake_err, gauss_copula]
# common holidays of most of the region, scored as a separate stratum
holidays: ["01-01", "05-01", "12-24", "12-25", "12-26", "12-31"]
