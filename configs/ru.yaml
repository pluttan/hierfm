# UES of Russia: UES -> 7 IPS -> regions (data/processed/ru is built by `make data`).
# The test period is provisional until docs/research settles on leakage and data gaps.
name: ru
processed: data/processed/ru
runs: runs/ru
horizons: [24, 168]
context: 2048
origin_hour: 21          # 00:00 Moscow time in UTC
test_start: "2025-07-01"
test_end: "2026-06-30"
windows: [7, 14, 28, 91, 365]
samples: 200
models:
  - {name: snaive, params: {season: 168}}
  - {name: gbm, params: {trees: 400, train_days: 730}}
  - {name: chronos2, params: {}}
  - {name: chronos2, label: chronos2_joint, params: {joint: true}}
  - {name: timesfm25, params: {batch: 256}}
  - {name: timesfm3, params: {}}
  - {name: timesfm3, label: timesfm3_joint, params: {joint: true}}
  - {name: moirai2, params: {}}
methods: [base, bu, ols, wls_struct, wls_var, mint_shrink, prior_shrink, prior_only]
dependence: [independent, schaake_hist, schaake_temp, schaake_err, gauss_copula]
